# Coverage is reported but never blocks a PR while it beds in. Both project and
# patch statuses are informational, so a coverage drop shows up in the Codecov
# comment/status without turning the check red. Tighten (drop `informational`,
# add a `target`) once a baseline is trusted.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Report each published crate separately in the PR comment and dashboard.
component_management:
  individual_components:
    - component_id: datafusion-openlineage
      name: datafusion-openlineage
      paths:
        - "crates/open-lineage/**"
    - component_id: openlineage-client
      name: openlineage-client
      paths:
        - "crates/openlineage-client/**"

# Examples and test harnesses are exercised by running them, not measured.
# Paths are matched against the report's workspace-relative file paths.
ignore:
  - "**/examples/**"
  - "**/tests/**"
  - "**/benches/**"

# CI uploads with OIDC (main and same-repo PRs) or tokenless (fork PRs); see
# the `coverage` job in .github/workflows/ci.yml. No CODECOV_TOKEN secret.
codecov:
  require_ci_to_pass: false

comment:
  layout: "reach, diff, flags, components, files"
  behavior: default
