# release-plz configuration — automated, independent per-crate releases.
#
# release-plz (https://release-plz.dev) is the Rust-native release tool (NOT
# Google's release-please). It analyzes conventional commits *per crate* to
# compute semver bumps, regenerates per-crate changelogs, keeps intra-workspace
# dependency version requirements in sync, and publishes to crates.io in
# topological order. PR titles are gated by .github/workflows/pr-title.yml.
#
# Both crates are versioned, changelogged, tagged, and GitHub-released, and
# published to crates.io:
#   - openlineage-client     -> a transport-agnostic library.
#   - datafusion-openlineage -> depends on the client, so release-plz publishes
#     the client first.
#
# Config reference: https://release-plz.dev/docs/config

[workspace]
# Link PRs/commits in the generated changelog back to the repo.
repo_url = "https://github.com/datafusion-contrib/datafusion-openlineage"

# --- Versioning / changelog ---
changelog_update = true        # regenerate per-crate CHANGELOG.md on each release
dependencies_update = false   # avoid refreshing all dependencies; workspace
                              # version/dependency updates can still change Cargo.lock
semver_check = true            # run cargo-semver-checks before bumping, to catch
                              # accidental breaking changes in published crates

# --- Git tags & GitHub releases (per-crate) ---
# Per-crate tags, e.g. `datafusion-openlineage-v0.1.0` / `openlineage-client-v0.1.0`.
# The package prefix keeps each crate's tags distinct.
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_enable = true
git_release_name = "{{ package }} v{{ version }}"
git_release_body = "{{ changelog }}"

# --- Publishing ---
# release-plz runs `cargo publish` itself, in dependency order. With
# `id-token: write` in the workflow it performs crates.io OIDC publishing, so
# no CARGO_REGISTRY_TOKEN secret is required.
publish = true
publish_timeout = "30m"

# --- Release PR appearance ---
pr_labels = ["release"]
pr_draft = false

# ---------------------------------------------------------------------------
# Per-package overrides.
# ---------------------------------------------------------------------------
[[package]]
name = "datafusion-openlineage"
# The crate's directory is `crates/open-lineage/` (only the package name was
# renamed), so pin the changelog path explicitly.
changelog_path = "crates/open-lineage/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Changelog rendering (git-cliff, embedded). Conventional-commit grouping.
# release-plz selects commits affecting each crate's files; commit types
# (feat, fix, etc.) determine the sections below, regardless of commit scope.
# ---------------------------------------------------------------------------
[changelog]
protect_breaking_commits = true
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc",      group = "Documentation" },
  { message = "^build",    group = "Build" },
  { message = "^test",     skip = true },
  { message = "^chore",    skip = true },
  { message = "^ci",       skip = true },
]

# Strip the redundant "(scope)" from each rendered line — each crate's changelog
# is already crate-scoped.
commit_preprocessors = [
  { pattern = '\((openlineage-client|client|datafusion-openlineage|open-lineage)\)', replace = "" },
]
