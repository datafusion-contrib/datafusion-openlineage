[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
arrow = "58"
async-trait = { version = "^0.1.89" }
buffa = { version = "0.7" }
buffa-types = { version = "0.7" }
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.19"
connectrpc = { version = "0.7" }
datafusion = "54"
datafusion-common = "54"
datafusion-expr = "54"
futures = "0.3.32"
object_store = { version = "0.13.2", features = ["azure", "aws", "gcp"] }
olai-http = { version = "0.0.5", features = ["connectrpc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "json",
    "migrate",
    "uuid",
] }
thiserror = { version = "2" }
tokio = { version = "1.47", features = ["macros", "rt", "sync"] }
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
    "serde",
    "std",
], default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }

# LOCAL, UNCOMMITTED — do not commit. The crates.io proxy hides olai-* 0.0.3
# (<7-day age filter); mangrove's olai-uc-* crates require 0.0.3. Resolve from
# the local trestle sibling for now. CI resolves from crates.io natively.
[patch.crates-io]
olai-http = { path = "../trestle/crates/olai-http" }
