name: Release-plz

# Automated releases. On every push to `main`, release-plz opens/updates a
# single "Release PR" containing per-crate version bumps + regenerated
# changelogs. The release job publishes any unpublished manifest versions to
# crates.io and creates per-crate git tags + GitHub Releases. Merging a Release
# PR triggers that job with the newly bumped versions.
# See release-plz.toml for versioning and changelog settings.

on:
  push:
    branches:
      - main

# Least privilege: grant per job, nothing at the top level.
permissions: {}

jobs:
  # --- Open/update the Release PR (version bumps + changelogs) ---
  release-plz-pr:
    name: Release PR
    # Never run from forks — they must not open release PRs.
    if: ${{ github.repository == 'datafusion-contrib/datafusion-openlineage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release-plz-* branch
      pull-requests: write # create/update the Release PR
    # Avoid two pushes to main racing to open/update the same PR.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # release-plz needs full history to analyze commits
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
      - name: Run release-plz (release-pr)
        # This action bundles cargo-semver-checks 0.51, whose breaking-change
        # exit code is understood by release-plz 0.3.170.
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release-pr
          # Respect release tag boundaries before inspecting historical manifests.
          version: "0.3.170"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Tag + GitHub Release + cargo publish for unpublished versions ---
  release-plz-release:
    name: Release
    if: ${{ github.repository == 'datafusion-contrib/datafusion-openlineage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Must match each crate's trusted publisher configuration on crates.io.
    environment: release
    permissions:
      contents: write # create tags + GitHub Releases
      pull-requests: read # look up the associated Release PR
      id-token: write # crates.io OIDC publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
      # No CARGO_REGISTRY_TOKEN secret: crates.io publish authenticates via OIDC
      # (`id-token: write`), which supplies temporary credentials to release-plz.
      - name: Run release-plz (release)
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release
          version: "0.3.170"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
