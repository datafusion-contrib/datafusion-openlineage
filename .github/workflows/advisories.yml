name: advisories

# RUSTSEC security advisories for the dependency tree. Kept out of the required
# `ci` roll-up: advisories are published independently of our changes, so a new
# one shouldn't block unrelated PRs. The weekly run catches advisories against
# an unchanged lockfile; Dependabot security updates open the fix PRs.

on:
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - .github/workflows/advisories.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories
