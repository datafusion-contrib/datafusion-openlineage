name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # Detect whether a PR touches anything that affects the build. A docs-only
  # change (Markdown, docs/, repo-meta files) can't break compilation or move
  # coverage, so the expensive `test` and `coverage` jobs gate on this and skip
  # when `code == 'false'`. On push to main / merge_group there is no PR diff to
  # filter against, so the filter falls through and `code` is 'true' (everything
  # runs). fmt and clippy are cheap and always run regardless.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # `code` is true when ANY changed path is NOT one of these docs/meta
          # patterns (negations are anchored at the repo root). Keep this list in
          # sync with the set of files that genuinely can't affect the build.
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'

  # fmt, clippy, test and coverage are independent jobs that run in parallel.
  # Splitting them (rather than one sequential job) means a clippy or fmt failure
  # no longer prevents the test job from running — you still get full test
  # results on every push even when the lints are red. Wall-clock drops to the
  # slowest single job instead of the sum of all checks.

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # fmt only parses source, so it needs no build cache —
      # keep this job seconds-fast for the quickest possible style feedback.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

  # Catch dangling dependencies (declared in Cargo.toml but never used). Cheap
  # and self-contained like fmt, so it always runs. Scoped to `crates/` — the
  # only Rust manifests; the action runs `cargo-machete` with no build needed.
  machete:
    name: machete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
        with:
          args: crates

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # clippy runs on a recent pinned stable for the best lints; the declared
      # MSRV floor (workspace rust-version) is verified separately by the `msrv`
      # job below.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
          components: clippy

      # Caches ~/.cargo and ./target keyed on the lockfile. clippy and test share
      # the "ci" shared-key so they reuse one warmed target/; only main writes the
      # cache (save-if) so parallel PR jobs don't thrash each other's entry.
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Deny warnings across every target and feature.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Verify the workspace actually builds on its declared MSRV floor
  # (rust-version in the workspace Cargo.toml). The other jobs run on a recent
  # pinned stable, so without this nothing would catch a dependency or syntax
  # bump that quietly raises the real minimum below what we promise on docs.rs.
  msrv:
    name: msrv
    # Skip on docs-only PRs (no code change can move the build result).
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Pinned to the workspace's declared rust-version. Bump in lock-step with
      # Cargo.toml's `rust-version` so this job tests exactly what we promise.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build on MSRV
        # Not --locked: freshly released deps (e.g. olai-http) can lag in the
        # crates.io proxy used to author commits, so the committed lockfile may
        # not yet pin them; let cargo resolve and update the lock here.
        run: cargo build --workspace --all-features

  test:
    name: test
    # Skip on docs-only PRs (no code change can move test results).
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dorny/test-reporter publishes a check run with the parsed JUnit results.
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binary (no compile); the ci profile emits JUnit XML.
      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-nextest

      # Live Marquez tests are marked #[ignore], so the default run needs no
      # services. The OpenLineage spec-conformance suite (tests/conformance.rs)
      # validates emitted events against vendored JSON Schemas here too.
      # --profile ci writes target/nextest/ci/junit.xml and runs every test
      # (fail-fast = false) so the report is complete even on failure.
      - name: Test
        run: cargo nextest run --workspace --all-features --profile ci

      # nextest does not run doctests; the old `cargo test` did, so run them here
      # to keep doctest coverage. Runs even if nextest failed above.
      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --doc

      # Surface per-test pass/fail in the PR Checks tab regardless of exit code —
      # this is what gives you results even when clippy/fmt are failing.
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: nextest results
          path: target/nextest/ci/junit.xml
          reporter: jest-junit

      - name: Upload JUnit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: junit-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  coverage:
    name: coverage
    # Skip on docs-only PRs (no code change can move coverage).
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Doctest coverage (`--doc` / `report --doctests`) relies on
      # `-Z unstable-options --persist-doctests`, which only the nightly
      # compiler accepts. Use the same nightly for all coverage collection and
      # reporting: stable and nightly can use incompatible LLVM profile formats.
      # llvm-tools-preview supplies the matching LLVM coverage tools.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview

      # Coverage recompiles with -C instrument-coverage, so it cannot reuse the
      # test/clippy "ci" cache — give it its own shared-key.
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Collect coverage from both nextest tests and doctests into one report.
      # --no-report retains existing artifacts, so clean once before collecting
      # either set of profiles to avoid merging stale data from earlier runs.
      - name: Collect coverage
        run: |
          cargo +nightly llvm-cov clean --workspace
          cargo +nightly llvm-cov --no-report nextest --workspace --all-features
          cargo +nightly llvm-cov --no-report --doc --workspace --all-features
          cargo +nightly llvm-cov report --doctests --codecov --output-path codecov.json

      # Upload coverage using the repository's Codecov credentials when present.
      # Upload failures do not fail this job.
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The OpenLineage adapter's acceptance test against the Marquez reference
  # backend. Separate job: it needs Docker (testcontainers spins up Marquez +
  # Postgres) and is gated behind the `marquez-it` feature + #[ignore], so it
  # never runs in the authoritative `ci` job above. Non-blocking for now
  # (continue-on-error) while the live harness beds in; flip off once stable.
  marquez-acceptance:
    name: marquez reference acceptance
    # Skip on docs-only PRs — no code change to validate against Marquez.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      # ubuntu-latest ships a working Docker daemon; testcontainers finds it at
      # the default socket. The test pulls marquezproject/marquez + postgres.
      - name: Marquez acceptance test
        run: cargo test -p datafusion-openlineage --features marquez-it --test marquez_acceptance -- --ignored --nocapture

  # Single roll-up status. Because `test`/`coverage` are conditionally skipped on
  # docs-only PRs, the individual checks aren't a stable name to require in branch
  # protection. This job always runs and turns red only if a job that *did* run
  # failed — a skipped job is a pass. Make THIS the one required check, so docs
  # PRs stay green without leaving a required check forever "pending".
  ci:
    name: ci
    if: ${{ always() }}
    needs: [fmt, machete, clippy, msrv, test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs succeeded or were skipped
        run: |
          # `needs.*.result` is one of: success | failure | cancelled | skipped.
          # Skipped is acceptable (docs-only path filtering); anything else that
          # isn't success fails the gate.
          for r in \
            "fmt:${{ needs.fmt.result }}" \
            "machete:${{ needs.machete.result }}" \
            "clippy:${{ needs.clippy.result }}" \
            "msrv:${{ needs.msrv.result }}" \
            "test:${{ needs.test.result }}" \
            "coverage:${{ needs.coverage.result }}"; do
            name="${r%%:*}"; result="${r##*:}"
            echo "$name -> $result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::required job '$name' did not succeed ($result)"
              exit 1
            fi
          done
          echo "All required jobs passed (or were skipped)."
